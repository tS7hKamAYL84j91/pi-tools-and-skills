name: Architecture Fitness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fitness:
    name: namespace, quality, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Hydrate dependencies
        run: npm ci

      - name: Run namespace, typecheck, lint, knip, and type coverage
        run: npm run check

      - name: Run unit and architecture tests
        run: npm test
