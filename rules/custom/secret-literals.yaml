rules:
  - id: tspi-hardcoded-secret
    languages: [typescript, javascript, python]
    message: "Possible hardcoded secret / credential. Move to environment-managed secret storage and rotate if exposed."
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798"
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
    patterns:
      - pattern-either:
          - pattern-regex: (?i)(api[_-]?key|apikey|secret[_-]?key|secretkey|auth[_-]?token|password|passwd|pwd)\s*[:=]\s*["'][a-zA-Z0-9_\-]{16,}["']
          - pattern-regex: (?i)(private[_-]?key|ssh[_-]?key|aws[_-]?secret|database[_-]?url)\s*[:=]\s*["'][^"']{20,}["']
      - pattern-not-regex: (?i)(example|placeholder|sample|test|dummy|xxx|your_)
